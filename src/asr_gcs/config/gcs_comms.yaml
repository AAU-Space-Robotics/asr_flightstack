# GCS-side comms parameters.
# serial_port: "auto" picks the telemetry radio from /dev/serial/by-id/,
#   skipping the u-blox GNSS receiver (which belongs to rtcm_reader).
# Set serial_port to "" to fall back to UDP (bind_port / target_ip / target_port).

/asr/gcs/comms_gcs:
  ros__parameters:
    serial_port: "auto"
    baud_rate: 115200

    # UDP fallback — used only when serial_port is "".
    bind_port: 14550
    target_ip: "192.168.1.100"   # UAV IP — update to match your network
    target_port: 14551

    system_id: 255
    component_id: 0
    wifi_enabled: true
    wifi_port: 14552

/asr/gcs/asr_logger_gcs:
  ros__parameters:
    log_dir: "~/gcs_logs"        # one gcs_YYYYMMDD_HHMMSS.ulg per GCS session
    sys_name: "asr_gcs"

/asr/gcs/rtcm_reader:
  ros__parameters:
    port: "auto"                 # "auto" finds the u-blox by its by-id name; or set an explicit device
    baudrate: 115200
    configure_receiver: true     # Run u-blox config + survey-in on startup
    survey_min_duration: 220     # Survey-in minimum duration (seconds)
    survey_accuracy_mm: 600    # Survey-in accuracy limit in mm (25000 mm = 25 m)
    measurement_rate_hz: 2.0     # RTCM observation rate (Hz); 1 Hz is the RTK standard and keeps the telemetry link light
